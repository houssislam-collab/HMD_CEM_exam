<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموقع الأول لتحضير الفروض والاختبارات | متوسط وثانوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1224;--panel:#131a33;--panel2:#1a2347;--line:rgba(255,255,255,.09);--text:#e9edf7;--muted:#8a96b8;--purple:#6b2fd6;--mid:#1e8a57;--sec:#e0a050;--accent:#8b5cf6;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:250px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{background:var(--purple);padding:20px 18px;font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-size:.7rem;font-weight:400;opacity:.85}
.side-sec{padding:12px 10px 4px}
.side-sec h4{font-size:.78rem;color:var(--muted);padding:0 10px 6px;font-weight:500}
.side-link{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:9px;font-size:.92rem;transition:background .15s}
.side-link:hover,.side-link.on{background:var(--panel2)}
.n{font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:8px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:#e9edf7;color:#152337;position:sticky;top:0;z-index:20}
.menu-btn{display:none;font-size:1.5rem;color:#152337}
.sbox{position:relative;flex:1;max-width:420px}
.search{width:100%;background:#fff;border:1px solid #cfd6e6;border-radius:9px;padding:8px 14px;font:inherit;color:#152337}
.results{position:absolute;top:110%;right:0;left:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.results a{display:block;padding:9px 14px;font-size:.9rem;border-bottom:1px solid var(--line)}
.results a:hover{background:var(--panel2)}
main{padding:24px;max-width:1200px;width:100%;margin:0 auto;flex:1}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.crumbs a:hover{color:var(--text)}
.banner{background:var(--purple);border-radius:12px;padding:16px 20px;font-weight:700;text-align:center;margin-bottom:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;text-align:center;color:var(--muted);margin-bottom:18px;font-size:.92rem}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stage{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.stage .hd{padding:14px;text-align:center;font-weight:800;font-size:1.1rem;color:#fff}
.stage .pic{height:140px;display:grid;place-items:center;font-size:4rem}
.stage a.row{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;transition:background .15s}
.stage a.row:hover{background:var(--panel2)}
.stage .ft{margin-top:auto;padding:14px;text-align:center;font-weight:700;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 0 0 14px;overflow:hidden;min-height:74px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{width:74px;align-self:stretch;display:grid;place-items:center;font-size:1.9rem;background:rgba(0,0,0,.22)}
.card .nm{flex:1;font-weight:700;padding:8px 0}
.card .nm small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
.pill{font-size:.75rem;border:1px solid var(--accent);color:#c4b5fd;border-radius:999px;padding:1px 12px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.88rem;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gh{margin:20px 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;transition:all .15s}
.cat:hover{transform:translateY(-2px);border-color:var(--accent)}
.cat.on{background:var(--panel2);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cat .e{font-size:1.8rem}
.cat b{display:block}
.cat small{color:var(--muted)}
.bar{height:8px;background:var(--panel);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;color:var(--text)}
details{margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
summary{padding:13px 18px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;list-style:none}
summary::after{content:"▾";transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
.file{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line)}
.file.done .t{text-decoration:line-through;color:var(--muted)}
.file .t{flex:1}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;transition:all .15s}
.ib:hover{border-color:var(--accent)}
.ib.on.fav{color:#fbbf24;border-color:#fbbf24}
.ib.on.dn{color:var(--ok);border-color:var(--ok);background:rgba(52,211,153,.1)}
.btn{background:var(--accent);color:#fff;border-radius:8px;padding:5px 14px;font-size:.84rem;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.empty{text-align:center;padding:30px 20px;color:var(--muted);border-top:1px solid var(--line)}
dialog{margin:auto;width:min(900px,94vw);height:88vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.vw{height:calc(100% - 52px);overflow:auto;direction:ltr;background:#2a2f45}
.vw iframe{display:block;border:0;background:#fff;transform-origin:0 0}
.vw img{display:block;margin:0 auto;max-width:none;background:#fff}
.zc{display:flex;align-items:center;gap:6px;direction:ltr}.zc span{min-width:48px;text-align:center;font-size:.85rem;color:var(--muted)}
.file{flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--accent);padding:10px 22px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;max-width:640px;margin:0 auto 16px}
.form label{display:grid;gap:6px;font-size:.88rem;color:var(--muted)}
.form textarea{resize:vertical}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;color:var(--text)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .btn{padding:11px;font-size:1rem}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:24px 12px}
@media(max-width:900px){aside{position:fixed;right:0;top:0;z-index:50;transform:translateX(100%);transition:transform .25s}aside.open{transform:none}.menu-btn{display:block}.grid{grid-template-columns:1fr 1fr}.cats{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.stages,.grid{grid-template-columns:1fr}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<aside id="side"></aside>
<div class="wrap">
  <header class="top">
    <button class="menu-btn" aria-label="القائمة" onclick="side.classList.toggle('open')">☰</button>
    <div class="sbox">
      <input class="search" id="q" placeholder="ابحث عن مادة أو شعبة... (مثال: رياضيات 3as)" autocomplete="off" aria-label="بحث">
      <div class="results" id="res"></div>
    </div>
  </header>
  <main id="view"></main>
  <footer>جميع الحقوق محفوظة © <span id="yr"></span> · <a href="#/admin" style="opacity:.45">إدارة</a></footer>
</div>
<dialog id="dlg"><div class="dh"><b id="dt"></b>
  <div class="zc"><button class="btn ghost" onclick="zoom(-.25)" aria-label="تبعيد">−</button><span id="zv">100%</span><button class="btn ghost" onclick="zoom(.25)" aria-label="تقريب">+</button><button class="btn ghost" onclick="zoom(0)" aria-label="إعادة الحجم">↺</button></div>
  <button class="btn ghost" onclick="dlg.close()">إغلاق ✕</button></div><div id="vw" class="vw"></div></dialog>
<div id="toast"></div>

<script>
/* ================= البيانات (عدّل هنا) ================= */
const SUBJ = {
  math:["الرياضيات","📐"], ar:["اللغة العربية","📜"], fr:["اللغة الفرنسية","🇫🇷"], en:["اللغة الإنجليزية","🇬🇧"],
  phy:["العلوم الفيزيائية","🧲"], hg:["التاريخ والجغرافيا","🗺️"], sci:["علوم الطبيعة والحياة","🌿"],
  isl:["التربية الإسلامية","🕋"], civ:["التربية المدنية","🤝"], art:["التربية الفنية","🎨"], it:["الإعلام الآلي","💻"],
  amz:["اللغة الأمازيغية","🔷"], mus:["التربية الموسيقية","🎵"], tech:["التكنولوجيا","🔨"], phil:["الفلسفة","💭"],
  eco:["الاقتصاد والمناجمنت","📈"], law:["القانون","⚖️"], acc:["التسيير المحاسبي والمالي","💵"],
  civeng:["الهندسة المدنية","🏗️"], eleng:["الهندسة الكهربائية","⚡"], meng:["الهندسة الميكانيكية","⚙️"],
  pheng:["هندسة الطرائق","🏭"], de:["اللغة الألمانية","🇩🇪"], es:["اللغة الإسبانية","🇪🇸"], itl:["اللغة الإيطالية","🇮🇹"]
};
const LEVELS = {
  mid:{name:"التعليم المتوسط",color:"var(--mid)",icon:"🏫",years:{"1am":"السنة الأولى متوسط","2am":"السنة الثانية متوسط","3am":"السنة الثالثة متوسط","4am":"السنة الرابعة متوسط (BEM)"}},
  sec:{name:"التعليم الثانوي",color:"var(--sec)",icon:"🎓",years:{"1as":"السنة الأولى ثانوي","2as":"السنة الثانية ثانوي","3as":"السنة الثالثة ثانوي (BAC)"}}
};
const MID = ["math","ar","fr","en","phy","hg","sci","isl","civ","art","it","amz","mus"];
const COMMON = ["ar","fr","en","hg","isl","amz"];
/* الشعب: g = المجموعة، y = السنوات المتاحة، s = المواد */
const GROUPS = {"علمية":"#3b82f6","أدبية":"#ec4899","اقتصادية":"#f59e0b"};
const STREAMS = {
  st:{n:"جذع مشترك علوم وتكنولوجيا",ic:"🔬",g:"علمية",y:["1as"],s:["math","phy","sci","tech","it",...COMMON]},
  la:{n:"جذع مشترك آداب",ic:"📚",g:"أدبية",y:["1as"],s:["ar","fr","en","hg","phil","math","isl","amz","it"]},
  sci:{n:"علوم تجريبية",ic:"🧬",g:"علمية",y:["2as","3as"],s:["sci","phy","math","phil",...COMMON]},
  math:{n:"رياضيات",ic:"➗",g:"علمية",y:["2as","3as"],s:["math","phy","sci","phil",...COMMON]},
  civ:{n:"تقني رياضي — هندسة مدنية",ic:"🏗️",g:"علمية",y:["2as","3as"],s:["civeng","math","phy","phil",...COMMON]},
  ele:{n:"تقني رياضي — هندسة كهربائية",ic:"⚡",g:"علمية",y:["2as","3as"],s:["eleng","math","phy","phil",...COMMON]},
  mec:{n:"تقني رياضي — هندسة ميكانيكية",ic:"⚙️",g:"علمية",y:["2as","3as"],s:["meng","math","phy","phil",...COMMON]},
  pro:{n:"تقني رياضي — هندسة الطرائق",ic:"🏭",g:"علمية",y:["2as","3as"],s:["pheng","math","phy","phil",...COMMON]},
  ge:{n:"تسيير واقتصاد",ic:"📈",g:"اقتصادية",y:["2as","3as"],s:["eco","acc","law","math","phil",...COMMON]},
  lp:{n:"آداب وفلسفة",ic:"🖋️",g:"أدبية",y:["2as","3as"],s:["ar","phil","hg","fr","en","math","isl","amz"]},
  le:{n:"لغات أجنبية",ic:"🌍",g:"أدبية",y:["2as","3as"],s:["fr","en","de","es","itl","ar","phil","hg","math","isl","amz"].filter(x=>true)}
};
const CATS = {homework:["فروض","📝"],exam:["اختبارات","🧾"],exercise:["تمارين","✏️"],summary:["ملخصات","📘"]};
const TERMS = {1:"الفصل الأول",2:"الفصل الثاني",3:"الفصل الثالث"};

/* الملفات. المفتاح: متوسط "السنة/المادة" — ثانوي "السنة/الشعبة/المادة"
   cat: homework | exam | exercise | summary ، term: 1 | 2 | 3 ، url: رابط الـPDF (فارغ = قريباً) */
const FILES = {}; // تُحمَّل الآن من Firebase تلقائياً

/* ================= مساعدات ================= */
const $=s=>document.querySelector(s);
const isMid=y=>y.endsWith("am");
const yearName=y=>LEVELS[isMid(y)?"mid":"sec"].years[y];
const keyOf=(y,st,s)=>isMid(y)?`${y}/${s}`:`${y}/${st}/${s}`;
const filesOf=k=>FILES[k]||[];
const subjectsOf=(y,st)=>isMid(y)?MID:STREAMS[st].s;
const sumFiles=(y,st)=>subjectsOf(y,st).reduce((a,s)=>a+filesOf(keyOf(y,st,s)).length,0);
const yearTotal=y=>isMid(y)?sumFiles(y):Object.keys(STREAMS).filter(k=>STREAMS[k].y.includes(y)).reduce((a,k)=>a+sumFiles(y,k),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ST={fav:[],done:[]};
try{ST=JSON.parse(localStorage.getItem("st")||'{"fav":[],"done":[]}')}catch(e){}
const save=()=>{try{localStorage.setItem("st",JSON.stringify(ST))}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1600)}
let ui={cat:"exam",term:0,q:"",group:"الكل"};

/* ================= الشريط الجانبي ================= */
function sidebar(){
  $("#side").innerHTML=`<a class="brand" href="#/"><span>✦</span><div>DzStudy<small>الموقع الأول لتحضير الفروض والاختبارات</small></div></a>
  ${Object.entries(LEVELS).map(([k,l])=>`<div class="side-sec"><h4>${l.name}</h4>
   ${Object.entries(l.years).map(([y,n])=>`<a class="side-link" href="#/${y}"><span><i class="dot" style="background:${l.color}"></i>${n}</span><span class="n">${yearTotal(y)}</span></a>`).join("")}</div>`).join("")}
  <div class="side-sec"><h4>مساحتي</h4>
   <a class="side-link" href="#/fav"><span>⭐ المفضلة</span><span class="n">${ST.fav.length}</span></a>
   <a class="side-link" href="#/done"><span>✅ أنجزتها</span><span class="n">${ST.done.length}</span></a></div>`;
}

/* ================= الصفحات ================= */
function home(){
  return `<div class="banner">الموقع الأول لتحضير الفروض والاختبارات في الجزائر</div>
  <div class="stages">${Object.entries(LEVELS).map(([k,l])=>`<section class="stage">
    <div class="hd" style="background:${l.color}">${l.name}</div><div class="pic" style="background:${l.color}22">${l.icon}</div>
    ${Object.entries(l.years).map(([y,n])=>`<a class="row" href="#/${y}"><span>${n}</span><span class="pill">${yearTotal(y)} ملف</span></a>`).join("")}
    <a class="ft" style="background:${l.color}" href="#/${Object.keys(l.years).pop()}">${k==="mid"?"شهادة التعليم المتوسط":"شهادة البكالوريا"}</a></section>`).join("")}</div>`;
}
function subjCards(y,st){
  return `<div class="grid">${subjectsOf(y,st).map(s=>`<a class="card" href="#/${isMid(y)?y:y+"/"+st}/${s}">
   <span class="ic">${SUBJ[s][1]}</span><span class="nm">${SUBJ[s][0]}</span><span class="pill" style="margin-left:6px">${filesOf(keyOf(y,st,s)).length} ملف</span></a>`).join("")}</div>`;
}
function yearPage(y){
  const head=`<div class="crumbs"><a href="#/">الرئيسية</a> / ${yearName(y)}</div><div class="banner">${yearName(y)}</div>`;
  if(isMid(y)) return head+`<div class="note">ملخصات، تمارين، ونماذج فروض واختبارات لتلاميذ ${yearName(y)}.</div>`+subjCards(y);
  const list=Object.entries(STREAMS).filter(([k,v])=>v.y.includes(y));
  const groups=["الكل",...new Set(list.map(([k,v])=>v.g))];
  return head+`<div class="note">اختر شعبتك لتظهر لك موادها فقط.</div>
  <div class="chips">${groups.map(g=>`<button class="chip ${g===ui.group?"on":""}" onclick="ui.group='${g}';render(1)">${g==="الكل"?"كل الشعب":"شعب "+g}</button>`).join("")}</div>
  ${[...new Set(list.map(([k,v])=>v.g))].filter(g=>ui.group==="الكل"||ui.group===g).map(g=>`
   <div class="gh"><i class="dot" style="background:${GROUPS[g]}"></i>الشعب ${g}</div>
   <div class="grid">${list.filter(([k,v])=>v.g===g).map(([k,v])=>`<a class="card" href="#/${y}/${k}"><span class="ic" style="background:${GROUPS[g]}33">${v.ic}</span><span class="nm">${v.n}<small>${v.s.length} مواد</small></span><span class="pill" style="margin-left:6px">${sumFiles(y,k)}</span></a>`).join("")}</div>`).join("")}`;
}
function streamPage(y,st){
  const v=STREAMS[st];
  return `<div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/${y}">${yearName(y)}</a> / ${v.n}</div>
  <div class="banner" style="background:${GROUPS[v.g]}">${v.ic} ${v.n} — ${yearName(y)}</div>`+subjCards(y,st);
}
function subjectPage(y,st,s){
  const k=keyOf(y,st,s), all=filesOf(k).map((f,i)=>({...f,id:f._id||k+"#"+i}));
  const done=all.filter(f=>ST.done.includes(f.id)).length, pct=all.length?Math.round(done/all.length*100):0;
  const parent=isMid(y)?`<a href="#/${y}">${yearName(y)}</a>`:`<a href="#/${y}">${yearName(y)}</a> / <a href="#/${y}/${st}">${STREAMS[st].n}</a>`;
  const list=all.filter(f=>f.cat===ui.cat&&(!ui.term||f.term==ui.term)&&f.t.includes(ui.q));
  const terms=ui.term?[ui.term]:[1,2,3];
  return `<div class="crumbs"><a href="#/">الرئيسية</a> / ${parent} / ${SUBJ[s][0]}</div>
  <div class="banner">${SUBJ[s][1]} ${SUBJ[s][0]} — ${yearName(y)}</div>
  <div class="bar" title="تقدمك"><i style="width:${pct}%"></i></div>
  <div style="font-size:.82rem;color:var(--muted);margin-bottom:16px">أنجزت ${done} من ${all.length} ملف (${pct}%)</div>
  <div class="cats">${Object.entries(CATS).map(([c,[n,e]])=>`<button class="cat ${c===ui.cat?"on":""}" onclick="ui.cat='${c}';render(1)"><span class="e">${e}</span><b>${n}</b><small>${all.filter(f=>f.cat===c).length} ملف</small></button>`).join("")}</div>
  <div class="tools">
   <div class="chips" style="margin:0">${[0,1,2,3].map(t=>`<button class="chip ${t===ui.term?"on":""}" onclick="ui.term=${t};render(1)">${t?TERMS[t]:"كل الفصول"}</button>`).join("")}</div>
   <input id="fq" placeholder="ابحث داخل ${CATS[ui.cat][0]}..." value="${esc(ui.q)}" oninput="ui.q=this.value;render(1,true)"></div>
  ${terms.map(t=>{const fs=list.filter(f=>f.term==t);return `<details open><summary><span>${TERMS[t]}</span><span class="n">${fs.length}</span></summary>
   ${fs.length?fs.map(fileRow).join(""):`<div class="empty">لا توجد ${CATS[ui.cat][0]} في ${TERMS[t]} بعد</div>`}</details>`}).join("")}`;
}
function fileRow(f){
  const fv=ST.fav.includes(f.id),dn=ST.done.includes(f.id);
  return `<div class="file ${dn?"done":""}"><span class="t">${esc(f.t)}${isAdminUser()&&f.by?` <small style="color:var(--muted)">· ${esc(f.by)}</small>`:""}</span>${f.sols&&f.sols.length?'<span class="pill" style="border-color:var(--ok);color:var(--ok)">مع الحل</span>':'<span class="pill" style="border-color:var(--line);color:var(--muted)">بدون حل</span>'}
   <button class="ib fav ${fv?"on":""}" title="مفضلة" onclick="tog('fav','${f.id}')">${fv?"★":"☆"}</button>
   <button class="ib dn ${dn?"on":""}" title="تم الإنجاز" onclick="tog('done','${f.id}')">✓</button>
   ${isAdminUser()&&f._id?`<button class="ib" title="حذف" onclick="del('${f._id}')">🗑</button>`:""}
   <button class="btn ghost ${f.url?"":"off"}" onclick="preview('${f.id}')">معاينة</button>
   ${f.sols&&f.sols.length?`<button class="btn ghost" style="border-color:var(--ok);color:var(--ok)" onclick="showSol('${f.id}')">الحل</button>`:""}
   <a class="btn ${f.url?"":"off"}" ${f.url?`href="${esc(f.url)}" download target="_blank" rel="noopener"`:""}>${f.url?"تحميل":"قريباً"}</a></div>`;
}
function byId(id){for(const k in FILES){const i=FILES[k].findIndex((f,j)=>(f._id||k+"#"+j)===id);if(i>=0)return{k,f:FILES[k][i]}}return{}}
function listPage(type){
  const ids=ST[type], title=type==="fav"?"⭐ المفضلة":"✅ الملفات التي أنجزتها";
  return `<div class="crumbs"><a href="#/">الرئيسية</a> / ${title}</div><div class="banner">${title}</div>
  <details open><summary><span>${ids.length} ملف</span></summary>${ids.length?ids.map(id=>{const{k,f}=byId(id);if(!f)return"";
   return `<div class="file"><span class="t">${esc(f.t)}<br><small style="color:var(--muted)">${CATS[f.cat][0]} · ${TERMS[f.term]}</small></span><a class="btn ghost" href="#/${k}">افتح المادة</a><button class="ib" onclick="tog('${type}','${id}')">✕</button></div>`}).join(""):`<div class="empty">لا شيء هنا حتى الآن. اضغط ${type==="fav"?"☆":"✓"} على أي ملف لإضافته.</div>`}</details>`;
}

/* ================= التفاعل ================= */
function tog(type,id){
  const a=ST[type],i=a.indexOf(id);
  i<0?a.push(id):a.splice(i,1);
  save();toast(i<0?(type==="fav"?"أُضيف إلى المفضلة ⭐":"أحسنت! تم الإنجاز ✅"):"تمت الإزالة");
  sidebar();render(1);
}
let Z=1;
const isImg=u=>/\.(png|jpe?g|webp|gif|avif)(\?|$)/i.test(u);
function openView(title,urls){
  Z=1;$("#dt").textContent=title;
  $("#vw").innerHTML=urls.map(u=>isImg(u)?`<img src="${esc(u)}" alt="${esc(title)}">`:`<iframe src="${esc(u)}" title="${esc(title)}"></iframe>`).join("");
  zoom(0);dlg.showModal();
}
function zoom(d){
  Z=d?Math.min(3,Math.max(.5,Z+d)):1;
  $("#zv").textContent=Math.round(Z*100)+"%";
  document.querySelectorAll("#vw img").forEach(i=>i.style.width=Z*100+"%");
  document.querySelectorAll("#vw iframe").forEach(i=>{i.style.width=100/Z+"%";i.style.height=100/Z+"%";i.style.transform=`scale(${Z})`});
}
function preview(id){const{f}=byId(id);if(f&&f.url)openView(f.t,[f.url])}
function showSol(id){const{f}=byId(id);if(f&&f.sols&&f.sols.length)openView("حل: "+f.t,f.sols)}
dlg.addEventListener("close",()=>$("#vw").innerHTML="");
addEventListener("keydown",e=>{if(!dlg.open)return;if(e.key==="+"||e.key==="=")zoom(.25);if(e.key==="-")zoom(-.25)});

/* بحث عام */
function allEntries(){
  const o=[];
  MID.forEach(s=>Object.keys(LEVELS.mid.years).forEach(y=>o.push([`${SUBJ[s][0]} — ${yearName(y)}`,`#/${y}/${s}`])));
  Object.entries(STREAMS).forEach(([k,v])=>v.y.forEach(y=>{o.push([`${v.n} — ${yearName(y)}`,`#/${y}/${k}`]);v.s.forEach(s=>o.push([`${SUBJ[s][0]} — ${yearName(y)} · ${v.n}`,`#/${y}/${k}/${s}`]))}));
  return o;
}
let IDX;
$("#q").addEventListener("input",e=>{
  const v=e.target.value.trim(),r=$("#res");
  if(!v){r.style.display="none";return}
  IDX=IDX||allEntries();
  const m=IDX.filter(([l])=>l.includes(v)).slice(0,8);
  r.innerHTML=m.length?m.map(([l,h])=>`<a href="${h}">${esc(l)}</a>`).join(""):`<a>لا نتائج</a>`;
  r.style.display="block";
});
document.addEventListener("click",e=>{if(!e.target.closest(".sbox"))$("#res").style.display="none"});

/* ================= Firebase + لوحة الإدارة ================= */
const CFG={
  firebase:{apiKey:"AIzaSyDhYQ5tEB-CZBA17siR93Uzg2oqJrKfmRw",authDomain:"dzexm-30ece.firebaseapp.com",projectId:"dzexm-30ece",appId:"1:643813983994:web:fd52c6b7f620d7557c6b43"},
  cloudinary:{cloud:"hlui9l85",preset:"dzexASD"}
};
const TEACHER="teachers@dzstudy.com";   // إيميل حساب الأساتذة المشترك
const DOMAIN="@dzstudy.com";            // يُضاف تلقائياً إذا كتب الأستاذ اسم مستخدم فقط
let DB=null,AUTH=null,USER=null;
const isAdminUser=()=>!!USER&&USER.email!==TEACHER;
const DB_OK=!!CFG.firebase.apiKey;
if(DB_OK){firebase.initializeApp(CFG.firebase);DB=firebase.firestore();AUTH=firebase.auth();AUTH.onAuthStateChanged(u=>{USER=u;render(1)})}
function loadRemote(){
  if(!DB_OK)return;
  DB.collection("files").get().then(sn=>{
    sn.forEach(d=>{const x=d.data();(FILES[x.key]=FILES[x.key]||[]).push({...x,_id:d.id})});
    sidebar();render(1);
  }).catch(console.error);
}
let AD={lv:"mid",y:"1am",st:"st",s:"math",cat:"exam",term:1};
function selHtml(){
  const mid=AD.lv==="mid",yrs=Object.entries(LEVELS[AD.lv].years);
  if(!LEVELS[AD.lv].years[AD.y])AD.y=yrs[0][0];
  const sts=Object.entries(STREAMS).filter(([k,v])=>v.y.includes(AD.y));
  if(!mid&&!sts.find(([k])=>k===AD.st))AD.st=sts[0][0];
  const subs=subjectsOf(AD.y,mid?null:AD.st);
  if(!subs.includes(AD.s))AD.s=subs[0];
  const S=(f,lab,o,cur)=>`<label>${lab}<select onchange="AD.${f}=this.value;$('#asel').innerHTML=selHtml()">${o.map(([v,l])=>`<option value="${v}" ${v==cur?"selected":""}>${l}</option>`).join("")}</select></label>`;
  return S("lv","المرحلة",[["mid","المتوسط"],["sec","الثانوي"]],AD.lv)+S("y","السنة",yrs,AD.y)
   +(mid?"":S("st","الشعبة",sts.map(([k,v])=>[k,v.n]),AD.st))+S("s","المادة",subs.map(x=>[x,SUBJ[x][0]]),AD.s)
   +S("cat","النوع",Object.entries(CATS).map(([k,v])=>[k,v[0]]),AD.cat)+S("term","الفصل",Object.entries(TERMS),AD.term);
}
function adminPage(){
  const head='<div class="crumbs"><a href="#/">الرئيسية</a> / الإدارة</div>';
  if(!DB_OK)return head+'<div class="banner">لوحة الإدارة</div><div class="empty">أكمل إعدادات Firebase داخل CFG في الكود أولاً.</div>';
  if(!USER)return head+`<div class="banner">🔐 دخول الإدارة</div>
   <form class="form" onsubmit="login(event)"><input id="em" type="text" placeholder="اسم المستخدم" autocomplete="username" required><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" required><button class="btn">دخول</button><small style="color:var(--muted);text-align:center;font-size:.76rem">يتم تسجيل بيانات الدخول (الجهاز والموقع التقريبي) لأغراض الأمان.</small></form>`;
  return head+`<div class="banner">➕ إضافة ملفات</div>
  <div class="form"><div class="frow" id="asel">${selHtml()}</div>
   <label>اسمك (الأستاذ)<input id="af-by" value="${esc(localStorage.getItem('by')||'')}" placeholder="مثال: الأستاذ محمد"></label>
   <label>عنوان الملف (يُستخدم عند رفع ملف واحد، وإلا يُؤخذ اسم الملف)<input id="af-t" placeholder="مثال: اختبار الفصل الأول"></label>
   <label>اختر ملفات PDF (يمكن اختيار عدة ملفات)<input id="af-file" type="file" accept=".pdf" multiple></label>
   <label>أو الصق رابطاً مباشراً<input id="af-url" placeholder="https://..."></label>
   <label>هل للملف حل؟<select id="af-hs" onchange="$('#af-solbox').style.display=this.value==='1'?'grid':'none'"><option value="0">لا يوجد حل</option><option value="1">نعم، يوجد حل</option></select></label>
   <div id="af-solbox" style="display:none;gap:14px">
    <label>الحل — صور الحل (يمكن اختيار عدة صور)<input id="af-sol" type="file" accept="image/*" multiple></label>
    <label>أو روابط صور الحل (رابط في كل سطر)<textarea id="af-solurl" rows="2" placeholder="https://..."></textarea></label>
   </div>
   <button class="btn" id="af-btn" onclick="upload()">رفع وحفظ</button></div>
  <div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${isAdminUser()?'<a class="btn ghost" href="#/logins">🛡️ سجل الدخول</a>':""}<button class="btn ghost" onclick="AUTH.signOut()">تسجيل الخروج (${esc(USER.email)})</button></div>`;
}
function deviceId(){let d=localStorage.getItem("did");if(!d){d=crypto.randomUUID();localStorage.setItem("did",d)}return d}
async function logLogin(){
  const u=AUTH.currentUser;if(!u)return;
  const info={email:u.email,device:deviceId(),ua:navigator.userAgent,platform:navigator.platform||"",lang:navigator.language,
    screen:screen.width+"x"+screen.height,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,ts:Date.now()};
  try{const r=await fetch("https://ipapi.co/json/");const j=await r.json();info.ip=j.ip;info.city=j.city;info.country=j.country_name;info.isp=j.org}catch(e){}
  try{await DB.collection("logins").add(info)}catch(e){}
}
async function login(e){
  e.preventDefault();
  let u=$("#em").value.trim();if(!u.includes("@"))u+=DOMAIN;
  try{await AUTH.signInWithEmailAndPassword(u,$("#pw").value);toast("تم الدخول ✅");logLogin()}
  catch(x){toast("الاسم أو كلمة السر خاطئة")}
}
function loginsPage(){
  if(!DB_OK||!isAdminUser())return '<div class="empty">غير مصرح</div>';
  DB.collection("logins").orderBy("ts","desc").limit(50).get().then(sn=>{
    const box=$("#lg");if(!box)return;
    box.innerHTML=sn.docs.map(d=>{const x=d.data();
      return `<div class="file"><span class="t">${new Date(x.ts).toLocaleString("ar")} — ${esc(x.city||"؟")}، ${esc(x.country||"")} — IP: ${esc(x.ip||"؟")}<br><small style="color:var(--muted)">${esc(x.email)} · جهاز ${esc((x.device||"").slice(0,8))} · ${esc(x.platform)} · ${esc(x.screen)} · ${esc(x.ua)}</small></span></div>`}).join("")||'<div class="empty">لا سجلات</div>';
  }).catch(()=>{const box=$("#lg");if(box)box.innerHTML='<div class="empty">تعذّر التحميل (تحقق من القواعد)</div>'});
  return '<div class="crumbs"><a href="#/admin">الإدارة</a> / سجل الدخول</div><div class="banner">🛡️ سجل الدخول</div><details open><summary><span>آخر 50 عملية دخول</span></summary><div id="lg"><div class="empty">جارٍ التحميل...</div></div></details>';
}
async function cloudUp(f){
  if(!CFG.cloudinary.cloud)throw new Error("أكمل إعدادات Cloudinary");
  const fd=new FormData();fd.append("file",f);fd.append("upload_preset",CFG.cloudinary.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloudinary.cloud}/auto/upload`,{method:"POST",body:fd});
  const j=await r.json();if(!j.secure_url)throw new Error(j.error&&j.error.message||"فشل الرفع");return j.secure_url;
}
async function upload(){
  const files=[...$("#af-file").files],url=$("#af-url").value.trim(),title=$("#af-t").value.trim();
  if(!files.length&&!url)return toast("اختر ملفاً أو الصق رابطاً");
  const by=$("#af-by").value.trim();if(!by)return toast("اكتب اسمك أولاً");
  try{localStorage.setItem("by",by)}catch(e){}
  const key=keyOf(AD.y,AD.st,AD.s),btn=$("#af-btn"),items=files.length?files:[null];
  const hs=$("#af-hs").value==="1",solFiles=hs?[...$("#af-sol").files]:[],
    solUrls=hs?$("#af-solurl").value.split("\n").map(x=>x.trim()).filter(Boolean):[];
  if(hs&&items.length>1)return toast("الحل يُضاف لملف واحد فقط — ارفع الملفات واحداً واحداً");
  if(hs&&!solFiles.length&&!solUrls.length)return toast("أضف صورة الحل أو اختر «لا يوجد حل»");
  btn.disabled=true;
  try{
    const sols=[];
    for(let j=0;j<solFiles.length;j++){btn.textContent=`جارٍ رفع صور الحل ${j+1}/${solFiles.length}...`;sols.push(await cloudUp(solFiles[j]))}
    sols.push(...solUrls);
    for(let i=0;i<items.length;i++){
      const f=items[i];btn.textContent=`جارٍ الرفع ${i+1}/${items.length}...`;
      const link=f?await cloudUp(f):url;
      const t=items.length===1&&title?title:(f?f.name.replace(/\.[^.]+$/,""):"ملف");
      const doc={key,t,cat:AD.cat,term:Number(AD.term),url:link,sols,by,uid:USER.uid,ts:Date.now()};
      const r=await DB.collection("files").add(doc);
      (FILES[key]=FILES[key]||[]).push({...doc,_id:r.id});
    }
    toast("تمت الإضافة ✅");$("#af-file").value="";$("#af-t").value="";$("#af-url").value="";if($("#af-sol")){$("#af-sol").value="";$("#af-solurl").value=""}sidebar();
  }catch(x){console.error(x);toast("تعذّر الرفع: "+x.message)}
  btn.disabled=false;btn.textContent="رفع وحفظ";
}
async function del(id){
  if(!confirm("حذف هذا الملف نهائياً؟"))return;
  try{await DB.collection("files").doc(id).delete();for(const k in FILES)FILES[k]=FILES[k].filter(f=>f._id!==id);sidebar();render(1);toast("تم الحذف")}catch(x){toast("تعذّر الحذف")}
}

/* ================= الراوتر ================= */
function render(keep,focusQ){
  const p=location.hash.slice(1).split("/").filter(Boolean),[a,b,c]=p;
  const sy=scrollY;let h;
  if(!a)h=home();
  else if(a==="admin")h=adminPage();
  else if(a==="logins")h=loginsPage();
  else if(a==="fav"||a==="done")h=listPage(a);
  else if(!(LEVELS.mid.years[a]||LEVELS.sec.years[a]))h=home();
  else if(isMid(a))h=b&&SUBJ[b]?subjectPage(a,null,b):yearPage(a);
  else if(!b||!STREAMS[b]||!STREAMS[b].y.includes(a))h=yearPage(a);
  else h=c&&SUBJ[c]&&STREAMS[b].s.includes(c)?subjectPage(a,b,c):streamPage(a,b);
  $("#view").innerHTML=h;
  side.classList.remove("open");
  if(keep)scrollTo(0,sy);else scrollTo(0,0);
  if(focusQ){const f=$("#fq");if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}
}
addEventListener("hashchange",()=>{ui={cat:"exam",term:0,q:"",group:"الكل"};$("#res").style.display="none";render()});
$("#yr").textContent=new Date().getFullYear();
sidebar();render();loadRemote();
</script>
